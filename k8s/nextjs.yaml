apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      imagePullSecrets:
        - name: gastronomy-secrets
      containers:
        - name: gastronomy-nextjs
          image: fernandoluppo/nextjs-app:latest
          command: ["yarn", "start"]
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: gastronomy-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
spec:
  type: NodePort
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
  selector:
    app: nextjs
