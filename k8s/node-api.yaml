apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      imagePullSecrets:
        - name: gastronomy-secrets
      containers:
        - name: gastronomy-node-api
          image: fernandoluppo/node-api:latest
          command: ["yarn", "start"]
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: gastronomy-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: node-api-service
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
  selector:
    app: node-api
